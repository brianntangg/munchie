name: Mobile CI

on:
  # Pull requests run CI once; pushes run it only after merging to main or tagging a sprint (e.g. sprint3).
  push:
    branches: [main]
    tags: ['sprint*']
  pull_request:
  workflow_dispatch:

# Every job's token is read-only unless the job asks for more (deploy and release do).
permissions:
  contents: read

# Stages run in order and stop at the first failure:
# install -> lint -> typecheck -> unit tests (coverage gate) -> integration tests -> coverage report -> build
#   -> migrate hosted database -> deploy to Pages (main only) / release (tags only).
# The scraper checks and the security scan run alongside, and the build waits for them too.
# Third-party actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  typecheck:
    name: Lint and typecheck mobile app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Fails below the coverage threshold in package.json; the summary feeds the coverage report stage.
        run: npm test -- --ci --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: Save coverage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: apps/mobile/coverage/coverage-summary.json
          retention-days: 7

  scraper:
    name: Scraper lint and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # Parser tests use saved pages, never the live NetNutrition site. Exit code 5 means no tests exist yet.
        run: pytest || [ $? -eq 5 ]

  security:
    # Dependency audit, static analysis and a secret scan of the whole history. Any High finding fails the PR.
    # How each result was triaged is in docs/security/scan-results.md.
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The secret scan reads every commit, not just the latest one.
          fetch-depth: 0

      - name: Check that actions are pinned to commit SHAs
        # A tag like @v4 can be moved to different code; a full commit SHA cannot.
        run: |
          unpinned=$(grep -n -E '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/*.yml | grep -v -E 'uses:[[:space:]]*\./' | grep -v -E '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then echo "::error::Pin these actions to a full commit SHA (keep the version in a comment):"; echo "$unpinned"; exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Audit app dependencies
        # Fails on any high or critical advisory in the app's production dependencies, except the ones listed in
        # .github/npm-audit-allowlist.txt (each with the reason and when it goes away). Reads only the lock file.
        working-directory: apps/mobile
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          if ! jq -e '.vulnerabilities' "$RUNNER_TEMP/audit.json" > /dev/null; then
            echo "::error::npm audit did not return results."; cat "$RUNNER_TEMP/audit.json"; exit 1
          fi
          jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | .url] | unique[]' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/found.txt"
          { grep -v -E '^[[:space:]]*(#|$)' ../../.github/npm-audit-allowlist.txt || true; } | cut -d' ' -f1 > "$RUNNER_TEMP/allowed.txt"
          blocked=$(grep -v -x -F -f "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/found.txt" || true)
          echo "High or critical advisories: $(wc -l < "$RUNNER_TEMP/found.txt"), allowed: $(grep -c -x -F -f "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/found.txt" || true)"
          if [ -n "$blocked" ]; then
            echo "::error::High or critical advisories found. Update the dependency (npm audit fix) or, if no fix exists yet, add it to .github/npm-audit-allowlist.txt with a reason."
            echo "$blocked"; npm audit --omit=dev --audit-level=high || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python scanners
        # Semgrep gets its own virtual environment: its dependencies conflict with pip-audit's. pydantic is pinned
        # because Semgrep 1.142 fails to start with newer releases.
        run: |
          pip install pip-audit==2.10.1 bandit==1.8.6
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.142.0 pydantic==2.11.9

      - name: Audit scraper dependencies
        # Fails on any known vulnerability in the pinned scraper requirements.
        run: pip-audit -r scraper/requirements.txt

      - name: Static analysis (Semgrep)
        # JavaScript/TypeScript, React, Python and GitHub Actions rules. Fails on ERROR-severity (High) results.
        run: >-
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --error --severity ERROR
          --config p/javascript --config p/typescript --config p/react --config p/python --config p/github-actions
          --exclude node_modules .

      - name: Static analysis (Bandit)
        # Scraper code only; the tests use pytest's assert by design (B101). Fails on High-severity results.
        run: bandit -r scraper -x scraper/tests --severity-level high

      - name: Secret scan (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1

  integration:
    name: Integration tests (local Supabase)
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Start local Supabase
        # Only the services the tests use: database, auth, storage, API gateway, REST, and email capture.
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Database tests
        run: supabase test db

      - name: Point the app at local Supabase
        run: |
          eval "$(supabase status -o env)"
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > apps/mobile/.env.local

      - name: Backend integration tests
        working-directory: apps/mobile
        run: npm run test:backend

  coverage:
    name: Coverage report
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-summary

      - name: Write coverage report
        run: |
          {
            echo '## Unit test coverage (`apps/mobile/src/lib`, gate 70%)'
            echo
            echo '| Metric | Covered | Total | Percent |'
            echo '| --- | --- | --- | --- |'
            jq -r '.total | to_entries[] | select(.key != "branchesTrue") | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |"' coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  build:
    name: Build web artifact
    # Runs after a merge to main or a sprint tag, once every check has passed.
    if: github.event_name == 'push'
    needs: [coverage, scraper, security]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        if: vars.EXPO_PUBLIC_SUPABASE_URL == ''
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Point the build at Supabase
        # Uses the repository variables when a hosted project is configured; otherwise the local Supabase
        # defaults, so the build runs against `npx supabase start` on any machine. Both values are public.
        env:
          HOSTED_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          HOSTED_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$HOSTED_URL" ]; then
            API_URL="$HOSTED_URL" PUBLISHABLE_KEY="$HOSTED_KEY"
          else
            (cd ../.. && supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor)
            eval "$(cd ../.. && supabase status -o env)"
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env.local
          echo "Building against $API_URL"

      - name: Export web build
        run: |
          npx expo export --platform web
          # Static hosts serve 404.html for unknown paths, so deep links load the app.
          cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: munchie-web-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: apps/mobile/dist
          retention-days: 90

      - name: Export GitHub Pages build
        # Only once a hosted project is configured; the site is served from /munchie.
        if: vars.EXPO_PUBLIC_SUPABASE_URL != ''
        run: |
          EXPO_BASE_URL=/munchie npx expo export --platform web --output-dir dist-pages
          cp dist-pages/index.html dist-pages/404.html

      - name: Upload GitHub Pages artifact
        if: vars.EXPO_PUBLIC_SUPABASE_URL != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/mobile/dist-pages

  migrate:
    name: Migrate hosted database
    # Applies new migrations before the site deploys, so the deployed app never queries tables or columns
    # that do not exist yet. If a migration fails, the deploy is skipped and the old site keeps running.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EXPO_PUBLIC_SUPABASE_URL != ''
    needs: build
    runs-on: ubuntu-latest
    # Hosted credentials live in the production environment, which only accepts main,
    # so pull request runs cannot read them.
    environment: production
    # One migration run at a time. A later run applies every pending migration, so a queued run never misses one.
    concurrency:
      group: hosted-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check hosted credentials
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in the production environment (see docs/pipeline.md)."; missing=1; fi
          done
          exit $missing

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: List pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        # Never --include-seed: seed.sql holds demo data for local development only.
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

  deploy:
    name: Deploy to GitHub Pages
    # The github-pages environment only accepts main, so tag runs skip this.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EXPO_PUBLIC_SUPABASE_URL != ''
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: munchie-web-${{ github.ref_name }}
          path: dist

      - name: Create GitHub release
        # The tag name is passed through an environment variable, never pasted into the script, so a tag name
        # containing shell syntax cannot run commands (flagged by Semgrep run-shell-injection).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && zip -qr "../munchie-web-$TAG.zip" .)
          # Name the release after the tagged commit's first line, e.g. "Munchie sprint4: Add likes and comments".
          # Read from the checked-out commit, so manual runs (where head_commit is empty) get a title too.
          SUMMARY="$(git log -1 --format=%s)"
          gh release create "$TAG" "munchie-web-$TAG.zip" --title "Munchie $TAG: $SUMMARY" --generate-notes
